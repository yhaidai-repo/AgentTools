name: PowerLoom

# Each service gets only the variables it needs: the Claude token never reaches the web.
# The agent-runner has the ADO token only to clone repos (user decision 2026-10-01).
x-db-url: &db-url postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

x-app: &app
  image: powerloom-app
  pull_policy: never

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Agent runs: one dispatched task per job. Writes the DB, then the task's PBI notes (backlog) and its drafts (via
  # VaultCapture, draft/ only). Docs, skills and the rest of the docs vault are read-only.
  agent-runner:
    <<: *app
    build:  # builds powerloom-app once; the web reuses it
      context: ..
      dockerfile: PowerLoom/Dockerfile.apps
    command: ["npm", "run", "start", "-w", "@powerloom/agent-runner"]
    environment:
      DATABASE_URL: *db-url
      # The fallback while Settings → AI providers has no Claude token; the runner sets the saved one before each run.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Claude's own folder on a volume: the runs' transcripts outlive a restart, so a task's next run continues a run
      # that didn't finish (user decision 2026-10-19). Auth is the token above or the one saved in Settings.
      CLAUDE_CONFIG_DIR: /agent-sessions
      # PowerLoom's own Codex home (Settings → AI providers → Connect Codex signs in here), never the user's ~/.codex.
      CODEX_HOME: /codex-home
      # ADO tokens are per vault, in Settings (user decision 2026-10-06): the runner reads them from the DB for its clones.
      # Agents with the Confluence integration on in their Config read and search pages with this account.
      CONFLUENCE_EMAIL: ${CONFLUENCE_EMAIL:-}
      CONFLUENCE_API_TOKEN: ${CONFLUENCE_API_TOKEN:-}
      CONFLUENCE_SITE: ${CONFLUENCE_SITE:-}
      REPO_CACHE_ROOT: /repo-cache
      DOCS_EXCLUDE: ${DOCS_EXCLUDE:-}  # folders of a vault hidden from agents
      BACKLOG_MOUNT: /vault
      SKILL_FOLDERS: /app/PowerLoom/skills:/skills:/app/DevSecrets/skills
      VAULT_CAPTURE_HOME: /app/VaultCapture
      VAULTS_DIR: /vaults
      VAULTS_EXCLUDE: ${VAULTS_EXCLUDE:-powerloom-backlog}
      RUNNER_PORT: "3200"  # PowerLoom starts the runs here (POST /runs, one at a time)
      POWERLOOM_URL: http://powerloom:8080  # … and takes the one callback per run
      # The agents' sandboxes (the `sandbox` profile): both set, or agents get no sandbox tools. URL: http://sandbox:3300
      SANDBOX_URL: ${SANDBOX_URL:-}
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-}
      # GSD for coding runs: `@opengsd/gsd-core` 1.19.0 as the container sees it, e.g. under /repos; empty = no GSD workspace
      GSD_CORE_DIR: ${GSD_CORE_DIR:-}
    volumes:
      - ${VAULT_PATH:?set in .env}:/vault
      # Every vault, writable: a run reads the docs of its task's vault and the tech-writer merges drafts into it (user decision 2026-10-02) and actualizes
      # notes; the vault review fixes links and moves removed notes to .trash/ (user decision 2026-10-03). Tools refuse draft/ and root files.
      - ${VAULTS_ROOT:?set in .env}:/vaults
      - ${SKILLS_PATH:?set in .env}:/skills:ro
      - ./skills:/app/PowerLoom/skills:ro  # from the repo, so skill edits apply without a rebuild
      - ../DevSecrets/skills:/app/DevSecrets/skills:ro  # DevSecrets tool skills (dev-local-run), read-only
      - repo-cache:/repo-cache
      - agent-sessions:/agent-sessions
      - ./agent-homes/codex:/codex-home  # git-ignored; the install script creates it
      # Local repositories (Settings → Repositories): git checkouts under REPOS_ROOT, cloned from here (user decision 2026-10-06).
      - ${REPOS_ROOT:?set in .env}:/repos:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3200/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      powerloom:
        condition: service_healthy  # PowerLoom migrates the schema at start
    restart: unless-stopped

  web:
    <<: *app
    command: ["npm", "run", "start", "-w", "@powerloom/web"]
    environment:
      DATABASE_URL: *db-url
      VAULT_PATH: ${VAULT_PATH}
      BACKLOG_MOUNT: /vault  # read-only here: "Continue with Claude" waits for the handoff note
      IMPORT_INBOX_PATH: ${IMPORT_INBOX_PATH:-./import-inbox}  # shown in Settings; only PowerLoom reads the folder
      SKILL_FOLDERS: /app/PowerLoom/skills:/skills:/app/DevSecrets/skills  # same as agent-runner, to list the skills an agent may use
      SKILLS_PATH: ${SKILLS_PATH}
      VAULTS_DIR: /vaults  # the Vault page reads the selected vault's notes and its VaultUsage log; Settings adds vaults from here
      # "Continue with Claude": PC paths in the claude:// link; the chat opens in the vaults root and adds the repos.
      CONTINUE_FOLDER: ${VAULTS_ROOT:?set in .env}
      REPOS_ROOT: ${REPOS_ROOT:-}
      REPOS_MOUNT: /repos  # Settings → Repositories checks a local repo's folder here
      AGENTTOOLS_PATH: ${AGENTTOOLS_PATH:-}  # "Configure with <agent>" for a new vault: VaultUsage and VaultCapture on the PC
      CONTINUE_LAUNCHER: ${CONTINUE_LAUNCHER:-claude-desktop}  # the agent app chats open in (model agnostic)
      VAULTS_EXCLUDE: ${VAULTS_EXCLUDE:-powerloom-backlog}
      POWERLOOM_URL: http://powerloom:8080  # the trash actions; more features follow the delivery plan
      TELEMETRY_INTERNAL_URL: ${OTEL_EXPORTER_OTLP_ENDPOINT:+http://telemetry:18888}
      # Legacy Grafana URL/port values keep existing installations on the same local address.
      TELEMETRY_URL: ${TELEMETRY_URL:-${GRAFANA_URL:-http://127.0.0.1:${TELEMETRY_PORT:-${GRAFANA_PORT:-3200}}}}
      SANDBOX_IMAGES: /app/PowerLoom/sandbox-images.json  # Settings → Data access → Sandbox lists its images
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3000"
    volumes:
      - ${VAULT_PATH:?set in .env}:/vault:ro
      - ${VAULTS_ROOT:?set in .env}:/vaults:ro
      - ${REPOS_ROOT:?set in .env}:/repos:ro
      - ${SKILLS_PATH:?set in .env}:/skills:ro
      - ./skills:/app/PowerLoom/skills:ro  # PowerLoom writes the skills now
      - ../DevSecrets/skills:/app/DevSecrets/skills:ro  # DevSecrets tool skills (dev-local-run), read-only
    depends_on:
      powerloom:
        condition: service_healthy
    restart: unless-stopped

  # A Claude chat's way in (design powerloom-mcp, 2026-10-23): the MCP server, loopback only, a bearer token from .env.
  # The same image as web and agent-runner; it reads the vaults like a run (the docs usage log is written) and starts an
  # Azure MCP server per session, so it has the runner's mounts, but no Claude token: the chat brings its own model.
  mcp:
    <<: *app
    command: ["npm", "run", "start", "-w", "@powerloom/mcp"]
    environment:
      DATABASE_URL: *db-url
      MCP_TOKEN: ${MCP_TOKEN:?set in .env}
      MCP_PORT: "3110"
      POWERLOOM_URL: http://powerloom:8080  # the commands write through PowerLoom, as the web does
      CONFLUENCE_EMAIL: ${CONFLUENCE_EMAIL:-}
      CONFLUENCE_API_TOKEN: ${CONFLUENCE_API_TOKEN:-}
      CONFLUENCE_SITE: ${CONFLUENCE_SITE:-}
      REPO_CACHE_ROOT: /repo-cache
      DOCS_EXCLUDE: ${DOCS_EXCLUDE:-}
      BACKLOG_MOUNT: /vault
      SKILL_FOLDERS: /app/PowerLoom/skills:/skills:/app/DevSecrets/skills
      VAULT_CAPTURE_HOME: /app/VaultCapture
      VAULTS_DIR: /vaults
      VAULTS_EXCLUDE: ${VAULTS_EXCLUDE:-powerloom-backlog}
      # PC paths of the two mounts below: pbi_attach takes a file by its PC path and reads it through them.
      VAULTS_HOST_ROOT: ${VAULTS_ROOT:-}
      REPOS_HOST_ROOT: ${REPOS_ROOT:-}
    ports:
      - "127.0.0.1:${MCP_PORT:-3110}:3110"
    volumes:
      - ${VAULT_PATH:?set in .env}:/vault:ro
      - ${VAULTS_ROOT:?set in .env}:/vaults
      - ${SKILLS_PATH:?set in .env}:/skills:ro
      - ./skills:/app/PowerLoom/skills:ro
      - ../DevSecrets/skills:/app/DevSecrets/skills:ro
      - repo-cache:/repo-cache
      - ${REPOS_ROOT:?set in .env}:/repos:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3110/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      powerloom:
        condition: service_healthy
    restart: unless-stopped

  # The agents' sandboxes (design agent-sandbox, user decisions 2026-10-28): one isolated container per run (no network,
  # no mounts but its own workspace, user 1000, read-only root, no capabilities, CPU/memory/pids limits) where an agent
  # builds, tests and runs scripts on a copy of its repos. The only PowerLoom service with Docker access, and only
  # through the socket proxy; the agent-runner calls it with SANDBOX_TOKEN and never gets Docker itself. Off unless
  # COMPOSE_PROFILES has `sandbox`; build its image first: docker build -t powerloom-sandbox - < Dockerfile.sandbox
  sandbox:
    <<: *app
    profiles: ["sandbox"]
    command: ["npm", "run", "start", "-w", "@powerloom/sandbox-service"]
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-}  # required: the service refuses to start without it
      SANDBOX_PORT: "3300"
      DOCKER_HOST: tcp://docker-proxy:2375
      # The images a vault may pick (Settings → Data access → Sandbox), from the app image; a vault's own image is added
      # to PowerLoom/sandbox-images.json and the image rebuilt.
      SANDBOX_IMAGES: /app/PowerLoom/sandbox-images.json
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-}  # e.g. runsc where gVisor is installed; empty = Docker's default
      SANDBOX_CPUS: ${SANDBOX_CPUS:-4}
      SANDBOX_MEMORY_MB: ${SANDBOX_MEMORY_MB:-8192}
      SANDBOX_DISK_MB: ${SANDBOX_DISK_MB:-20480}
      SANDBOX_MAX_COMMAND_MS: ${SANDBOX_MAX_COMMAND_MS:-600000}
      # Package restores (sandbox_restore): their containers join this network, whose only way out is sandbox-egress.
      SANDBOX_EGRESS_NETWORK: powerloom-sandbox-egress
      SANDBOX_PROXY_URL: http://sandbox-egress:3128
      # Signs each restore's pass with its vault's package hosts; the same value as sandbox-egress's.
      SANDBOX_PROXY_SECRET: ${SANDBOX_PROXY_SECRET:-}
      # Compose labels its own containers with the project but doesn't pass the name in: the service needs it to put its
      # sandbox and restore containers in the same group (Docker Desktop). Compose fills the variable itself, even with -p.
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
    networks: [default, docker-api]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3300/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - docker-proxy
    restart: unless-stopped

  # The restore containers' only way out: HTTPS tunnels to the hosts a restore's signed pass names (its vault's
  # package hosts, Settings → Data access → Sandbox), every tunnel logged. It sees host names only, never the traffic or
  # a feed's token. Without SANDBOX_PROXY_SECRET every restore gets the fixed list SANDBOX_PACKAGE_HOSTS instead.
  sandbox-egress:
    <<: *app
    profiles: ["sandbox"]
    command: ["npm", "run", "proxy", "-w", "@powerloom/sandbox-service"]
    environment:
      SANDBOX_PROXY_SECRET: ${SANDBOX_PROXY_SECRET:-}
      SANDBOX_PACKAGE_HOSTS: ${SANDBOX_PACKAGE_HOSTS:-api.nuget.org,registry.npmjs.org}
      SANDBOX_PROXY_PORT: "3128"
    networks: [default, sandbox-egress]
    restart: unless-stopped

  # The Docker API for the sandbox service only, cut down to what it uses (containers, exec, images, volumes); on an
  # internal network no other service is on.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.1
    profiles: ["sandbox"]
    environment:
      CONTAINERS: 1
      EXEC: 1
      IMAGES: 1
      VOLUMES: 1
      POST: 1
      DELETE: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-api]
    restart: unless-stopped

  # Daily pg_dump into BACKUP_PATH on the PC; keeps BACKUP_KEEP_DAYS days.
  # PowerLoom: the .NET backend taking over the worker's jobs feature by feature (the vault's adoa-backend-delivery note).
  powerloom:
    build:
      context: .
    environment:
      ConnectionStrings__PowerLoom: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Vaults__Root: /vaults
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}  # logs, metrics and traces to Aspire Dashboard; empty = off
      TELEMETRY_INTERNAL_URL: ${OTEL_EXPORTER_OTLP_ENDPOINT:+http://telemetry:18888}
      TELEMETRY_API_KEY: ${TELEMETRY_API_KEY:-}  # optional, for an API-key-secured diagnostics service
      VaultCapture__Home: /app/VaultCapture  # findings into a project's registers go through the module
      Vaults__HostRoot: ${VAULTS_ROOT:?set in .env}  # the vaults root as the PC sees it: new vaults' files, chat links
      Vaults__TemplateHome: /app/templates/vault  # root files of a new vault (Settings → Add vault)
      Vaults__Exclude: ${VAULTS_EXCLUDE:-powerloom-backlog}
      Backlog__Root: /vault  # PowerLoom's backlog vault: the chat notes are written here
      Import__InboxRoot: /import-inbox  # the import sources' files (Outlook mails, inbox requests)
      Confluence__Email: ${CONFLUENCE_EMAIL:-}  # the linked Confluence pages are fetched with this account
      Confluence__ApiToken: ${CONFLUENCE_API_TOKEN:-}
      Confluence__Site: ${CONFLUENCE_SITE:-}
      Repos__Mount: /repos  # Settings → Repositories checks a local repo's folder here
      Skills__Folders__0: /app/PowerLoom/skills  # the skill folders in the agent-runner's order (SKILL_FOLDERS)
      Skills__Folders__1: /skills
      Skills__Folders__2: /app/DevSecrets/skills
      Skills__Editable: /app/PowerLoom/skills  # the Skills page edits PowerLoom's own skills only (user decision 2026-10-01); each save keeps the old version in the DB
      Chat__Launcher: ${CONTINUE_LAUNCHER:-claude-desktop}  # the chat app while Settings → AI providers has none chosen
      Chat__ReposRoot: ${REPOS_ROOT:-}  # PC paths for the chat links: the repos
      Chat__BacklogHostRoot: ${VAULT_PATH:?set in .env}  # … PowerLoom's backlog vault
      Chat__AgentTools: ${AGENTTOOLS_PATH:-}  # … VaultUsage and VaultCapture, for "Configure with <agent>"
      Chat__CodexHistoryRoot: /desktop-chats/codex
      Chat__ClaudeSessionsRoot: /desktop-chats/claude
      Runner__Url: http://agent-runner:3200  # the agents' dispatch starts the runs there
      # The MCP server as the PC sees it and its token: written into every vault's .mcp.json (Add vault, every start).
      Mcp__Url: http://127.0.0.1:${MCP_PORT:-3110}/mcp
      Mcp__Token: ${MCP_TOKEN:-}
    ports:
      - "127.0.0.1:${POWERLOOM_PORT:-5180}:8080"
    volumes:
      - ${VAULTS_ROOT:?set in .env}:/vaults  # read-write: trash, records and notes are written here
      - ${VAULT_PATH:?set in .env}:/vault  # PowerLoom's backlog vault: chat notes
      # PBI import requests from tools outside Docker (e.g. the Outlook exporter); read files are deleted.
      - ${IMPORT_INBOX_PATH:-./import-inbox}:/import-inbox
      - ../VaultCapture:/app/VaultCapture:ro
      - ./templates/vault:/app/templates/vault:ro
      - ${REPOS_ROOT:?set in .env}:/repos:ro
      - ./skills:/app/PowerLoom/skills  # writable: the Skills page's saves
      - ${SKILLS_PATH:?set in .env}:/skills:ro
      - ../DevSecrets/skills:/app/DevSecrets/skills:ro
      # Desktop histories only; the desktop login files and the runner's agent homes are not mounted here.
      # Set-DesktopChatHistory.ps1 discovers these paths on the PC and creates empty fallbacks for missing apps.
      - ${CODEX_DESKTOP_SESSIONS_PATH:-./desktop-chats/codex/sessions}:/desktop-chats/codex/sessions:ro
      - ${CODEX_DESKTOP_INDEX_PATH:-./desktop-chats/codex/session_index.jsonl}:/desktop-chats/codex/session_index.jsonl:ro
      - ${CLAUDE_DESKTOP_SESSIONS_PATH:-./desktop-chats/claude}:/desktop-chats/claude:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # One local diagnostics viewer and bounded persistent telemetry store, replacing the Grafana/LGTM stack.
  telemetry:
    image: mcr.microsoft.com/aspire/dashboard:13.6.2
    profiles: ["observability"]
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:18888
      ASPIRE_DASHBOARD_OTLP_ENDPOINT_URL: http://0.0.0.0:4317
      ASPIRE_DASHBOARD_OTLP_HTTP_ENDPOINT_URL: http://0.0.0.0:4318
      # Local UI only; OTLP receivers are reachable on the private compose network, with no published ingest ports.
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
      ASPIRE_DASHBOARD_APPLICATION_NAME: PowerLoom
      ASPIRE_DASHBOARD_DATA_DIRECTORY: /home/app/dashboard-data
      ASPIRE_DASHBOARD_PERSISTENCE_MODE: resume
      Dashboard__TelemetryLimits__MaxLogCount: "10000"
      Dashboard__TelemetryLimits__MaxTraceCount: "5000"
      Dashboard__TelemetryLimits__MaxMetricsCount: "1000"
    ports:
      - "127.0.0.1:${TELEMETRY_PORT:-${GRAFANA_PORT:-3200}}:18888"
    volumes:
      - telemetry-data:/home/app
    networks:
      default:
        aliases: [otel-lgtm]  # existing OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4317 keeps working
    restart: unless-stopped

  # search_web's SearXNG (user decision 2026-10-28): general engines, searching from this PC's address. Reached only by
  # the agent-runner on Docker's network (no published port); Settings → Data access → Web search switches it on for
  # agents. Pinned, so engines change only when the tag is updated here.
  searxng:
    image: searxng/searxng:2026.10.24-ef0ec03da
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/backup-cron.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./scripts:/scripts:ro
      - ${BACKUP_PATH:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy

networks:
  default: {}
  # Only the sandbox service and the socket proxy: nothing else reaches the Docker API.
  docker-api:
    internal: true
  # The restore containers and the egress proxy only; named, because the sandbox service attaches containers to it.
  sandbox-egress:
    internal: true
    name: powerloom-sandbox-egress

volumes:
  # Named after the old compose project (adoa): the volumes keep their data across the rename to powerloom.
  # One read-only checkout per repo, shared by research and design; refreshed at most every 30 min.
  repo-cache:
    name: adoa_repo-cache
  telemetry-data:
    name: powerloom_telemetry-data
  # Agent run transcripts (CLAUDE_CONFIG_DIR of the agent-runner); a task's are deleted when it succeeds.
  agent-sessions:
    name: powerloom_agent-sessions
  # external: `docker compose down -v` cannot delete it. First run: docker volume create adoa_pgdata
  pgdata:
    external: true
    name: adoa_pgdata
