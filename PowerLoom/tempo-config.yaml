# Tempo inside otel-lgtm, mounted over the image's /otel-lgtm/tempo-config.yaml (docker-compose.yml). Same as the
# image's file (grafana/otel-lgtm, read 2026-10-21) plus the compactor: without block_retention the trace blocks never
# go (7 513 blocks, 1.2 GB on 2026-10-21). Prometheus keeps the span metrics (rates, counts) past the traces.
server:
  http_listen_port: 3200
  grpc_listen_port: 9096

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "127.0.0.1:4417"
        http:
          endpoint: "127.0.0.1:4418"

memberlist:
  bind_addr: [127.0.0.1]
  bind_port: 7947

querier:
  frontend_worker:
    frontend_address: 127.0.0.1:9096

storage:
  trace:
    backend: local
    wal:
      path: /data/tempo/wal
    local:
      path: /data/tempo/blocks

backend_worker:
  compaction:
    block_retention: 168h  # 7 days of traces (user decision 2026-10-21)

metrics_generator:
  processor:
    span_metrics:
      dimensions:
        - service_name
        - operation
        - status_code
  storage:
    path: /data/tempo/generator/wal
    remote_write:
      - url: http://127.0.0.1:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
