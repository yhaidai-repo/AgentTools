name: adoa

x-app: &app
  image: adoa-app
  pull_policy: never
  env_file: .env
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    build: .  # builds adoa-app once; worker and web reuse it
    command: ["npm", "run", "migrate", "-w", "@adoa/db"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  worker:
    <<: *app
    command: ["npm", "run", "start", "-w", "@adoa/worker"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      VAULT_ROOT: /vault
    volumes:
      - ${VAULT_PATH:?set in .env}:/vault
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    <<: *app
    command: ["npm", "run", "start", "-w", "@adoa/web"]
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3000"
    volumes:
      - ${VAULT_PATH:?set in .env}:/vault:ro
    depends_on:
      worker:
        condition: service_started
    restart: unless-stopped

  # Daily pg_dump into BACKUP_PATH on the PC; keeps BACKUP_KEEP_DAYS days.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/backup-cron.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./scripts:/scripts:ro
      - ${BACKUP_PATH:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  # external: `docker compose down -v` cannot delete it. First run: docker volume create adoa_pgdata
  pgdata:
    external: true
    name: adoa_pgdata
