name: adoa

# Each service gets only the variables it needs: the Claude token never reaches the worker or web.
# The agent-runner has the ADO token only to clone repos (user decision 2026-10-01).
x-db-url: &db-url postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

x-app: &app
  image: adoa-app
  pull_policy: never

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    build:  # builds adoa-app once; the other app services reuse it
      context: ..
      dockerfile: Adoa/Dockerfile
    command: ["npm", "run", "migrate", "-w", "@adoa/db"]
    environment:
      DATABASE_URL: *db-url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  worker:
    <<: *app
    command: ["npm", "run", "start", "-w", "@adoa/worker"]
    environment:
      DATABASE_URL: *db-url
      ADO_PAT: ${ADO_PAT}
      # Read-only Confluence access for the pages PBIs link (empty = those links become tasks for you).
      CONFLUENCE_EMAIL: ${CONFLUENCE_EMAIL:-}
      CONFLUENCE_API_TOKEN: ${CONFLUENCE_API_TOKEN:-}
      VAULT_ROOT: /vault/${BACKLOG_FOLDER-backlog}  # adoa renders into this folder of the vault; empty = the vault root
      VAULT_CAPTURE_HOME: /app/VaultCapture
      DOCS_VAULT_NAME: ${DOCS_VAULT_NAME:?set in .env}
      ADOA_SEED_ADO_ORG_URL: ${ADOA_SEED_ADO_ORG_URL:-}
      ADOA_SEED_ADO_PROJECT: ${ADOA_SEED_ADO_PROJECT:-}
      ADOA_SEED_ADO_TEAM: ${ADOA_SEED_ADO_TEAM:-}
      ADOA_SEED_ADO_USER: ${ADOA_SEED_ADO_USER:-}
      IMPORT_INBOX_ROOT: /import-inbox
      VAULTS_DIR: /vaults
      VAULTS_EXCLUDE: ${VAULTS_EXCLUDE:-adoa-backlog}  # never offered to scheduled vault reviews (adoa's backlog vault)
    volumes:
      - ${VAULT_PATH:?set in .env}:/vault
      # PBI import requests from tools outside Docker (e.g. the Outlook exporter); read files are deleted.
      - ${IMPORT_INBOX_PATH:-./import-inbox}:/import-inbox
      # Every vault (user decision 2026-10-03). Writable: VaultCapture writes drafts and, when the user submits a finding,
      # register records into the docs vault, /vaults/<DOCS_VAULT_NAME> (user decision 2026-10-02); scheduled vault reviews read the rest.
      - ${VAULTS_ROOT:?set in .env}:/vaults
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Agent runs: one dispatched task per job. Writes the DB, then the task's PBI notes (backlog) and its drafts (via
  # VaultCapture, draft/ only). Docs, skills and the rest of the docs vault are read-only.
  agent-runner:
    <<: *app
    command: ["npm", "run", "start", "-w", "@adoa/agent-runner"]
    environment:
      DATABASE_URL: *db-url
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      # Agents with the Confluence integration on in their Config read and search pages with this account.
      CONFLUENCE_EMAIL: ${CONFLUENCE_EMAIL:-}
      CONFLUENCE_API_TOKEN: ${CONFLUENCE_API_TOKEN:-}
      CONFLUENCE_SITE: ${CONFLUENCE_SITE:-}
      ADO_PAT: ${ADO_PAT}
      REPO_CACHE_ROOT: /repo-cache
      DOCS_ROOT: /docs
      DOCS_EXCLUDE: ${DOCS_EXCLUDE:-}  # folders of the docs vault hidden from agents (the backlog has its own vault)
      VAULT_ROOT: /vault/${BACKLOG_FOLDER-backlog}
      SKILL_FOLDERS: /app/Adoa/skills:/skills
      VAULT_CAPTURE_HOME: /app/VaultCapture
      DOCS_VAULT_NAME: ${DOCS_VAULT_NAME:?set in .env}
      VAULTS_DIR: /vaults
      VAULTS_EXCLUDE: ${VAULTS_EXCLUDE:-adoa-backlog}
    volumes:
      - ${DOCS_VAULT_PATH:?set in .env}:/docs:ro
      - ${VAULT_PATH:?set in .env}:/vault
      # Every vault, writable: the tech-writer merges drafts into the docs vault (user decision 2026-10-02) and actualizes
      # notes; the vault review fixes links and moves removed notes to .trash/ (user decision 2026-10-03). Tools refuse draft/ and root files.
      - ${VAULTS_ROOT:?set in .env}:/vaults
      - ${SKILLS_PATH:?set in .env}:/skills:ro
      - ./skills:/app/Adoa/skills:ro  # from the repo, so skill edits apply without a rebuild
      - repo-cache:/repo-cache
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    <<: *app
    command: ["npm", "run", "start", "-w", "@adoa/web"]
    environment:
      DATABASE_URL: *db-url
      ADO_PAT: ${ADO_PAT}
      VAULT_PATH: ${VAULT_PATH}
      BACKLOG_FOLDER: ${BACKLOG_FOLDER-backlog}
      VAULT_ROOT: /vault/${BACKLOG_FOLDER-backlog}  # read-only here: "Continue with Claude" waits for the handoff note
      IMPORT_INBOX_PATH: ${IMPORT_INBOX_PATH:-./import-inbox}  # shown in Settings; only the worker reads the folder
      SKILL_FOLDERS: /app/Adoa/skills:/skills  # same as agent-runner, to list the skills an agent may use
      SKILLS_PATH: ${SKILLS_PATH}
      DOCS_VAULT_NAME: ${DOCS_VAULT_NAME:?set in .env}  # links to agents' draft notes
      DOCS_ROOT: /docs  # the Vault page reads the docs vault's notes and its VaultUsage log
      VAULTS_DIR: /vaults  # the schedule form lists the vault folders
      # "Continue with Claude": PC paths in the claude:// link; the chat opens in the vaults root and adds the repos.
      CONTINUE_FOLDER: ${VAULTS_ROOT:?set in .env}
      REPOS_ROOT: ${REPOS_ROOT:-}
      CONTINUE_LAUNCHER: ${CONTINUE_LAUNCHER:-claude-desktop}  # the agent app chats open in (model agnostic)
      VAULTS_EXCLUDE: ${VAULTS_EXCLUDE:-adoa-backlog}
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3000"
    volumes:
      - ${VAULT_PATH:?set in .env}:/vault:ro
      - ${DOCS_VAULT_PATH:?set in .env}:/docs:ro
      - ${VAULTS_ROOT:?set in .env}:/vaults:ro
      - ${SKILLS_PATH:?set in .env}:/skills:ro
      # Writable: the Config page edits adoa's own skills only (user decision 2026-10-01); each save keeps the old version in the DB.
      - ./skills:/app/Adoa/skills
    depends_on:
      worker:
        condition: service_started
    restart: unless-stopped

  # Daily pg_dump into BACKUP_PATH on the PC; keeps BACKUP_KEEP_DAYS days.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/backup-cron.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./scripts:/scripts:ro
      - ${BACKUP_PATH:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  # One read-only checkout per repo, shared by research and design; refreshed at most every 30 min.
  repo-cache:
  # external: `docker compose down -v` cannot delete it. First run: docker volume create adoa_pgdata
  pgdata:
    external: true
    name: adoa_pgdata
