name: adoa

# Each service gets only the variables it needs: the Claude token never reaches the worker or web.
# The agent-runner has the ADO token only to clone repos (user decision 2026-10-01).
x-db-url: &db-url postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

x-app: &app
  image: adoa-app
  pull_policy: never

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    build:  # builds adoa-app once; the other app services reuse it
      context: ..
      dockerfile: Adoa/Dockerfile
    command: ["npm", "run", "migrate", "-w", "@adoa/db"]
    environment:
      DATABASE_URL: *db-url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  worker:
    <<: *app
    command: ["npm", "run", "start", "-w", "@adoa/worker"]
    environment:
      DATABASE_URL: *db-url
      ADO_PAT: ${ADO_PAT}
      VAULT_ROOT: /vault
      DOCS_DRAFT_ROOT: /docs-draft
      ADOA_SEED_ADO_ORG_URL: ${ADOA_SEED_ADO_ORG_URL:-}
      ADOA_SEED_ADO_PROJECT: ${ADOA_SEED_ADO_PROJECT:-}
      ADOA_SEED_ADO_TEAM: ${ADOA_SEED_ADO_TEAM:-}
      ADOA_SEED_ADO_USER: ${ADOA_SEED_ADO_USER:-}
    volumes:
      - ${VAULT_PATH:?set in .env}:/vault
      # VaultCapture drafts: the only folder of the docs vault the worker may write.
      - ${DOCS_VAULT_PATH:?set in .env}/draft:/docs-draft
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Agent runs (refinement, later research/design). Read-only docs, Vault and skills; writes only the DB.
  agent-runner:
    <<: *app
    command: ["npm", "run", "start", "-w", "@adoa/agent-runner"]
    environment:
      DATABASE_URL: *db-url
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      ADO_PAT: ${ADO_PAT}
      REPO_CACHE_ROOT: /repo-cache
      DOCS_ROOT: /docs
      DOCS_EXCLUDE: ${DOCS_EXCLUDE:-backlog}  # the rendered backlog is inside the docs vault; agents must not read their own output
      VAULT_ROOT: /vault
      SKILL_FOLDERS: /app/Adoa/skills:/skills
    volumes:
      - ${DOCS_VAULT_PATH:?set in .env}:/docs:ro
      - ${VAULT_PATH:?set in .env}:/vault:ro
      - ${SKILLS_PATH:?set in .env}:/skills:ro
      - repo-cache:/repo-cache
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    <<: *app
    command: ["npm", "run", "start", "-w", "@adoa/web"]
    environment:
      DATABASE_URL: *db-url
      ADO_PAT: ${ADO_PAT}
      VAULT_PATH: ${VAULT_PATH}
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3000"
    volumes:
      - ${VAULT_PATH:?set in .env}:/vault:ro
    depends_on:
      worker:
        condition: service_started
    restart: unless-stopped

  # Daily pg_dump into BACKUP_PATH on the PC; keeps BACKUP_KEEP_DAYS days.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/backup-cron.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./scripts:/scripts:ro
      - ${BACKUP_PATH:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  # One read-only checkout per repo, shared by research and design; refreshed at most every 30 min.
  repo-cache:
  # external: `docker compose down -v` cannot delete it. First run: docker volume create adoa_pgdata
  pgdata:
    external: true
    name: adoa_pgdata
